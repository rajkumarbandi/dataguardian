[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
name = "dataguardian"
version = "0.8.0"
description = "Enterprise AI-Powered Data Stewardship Platform on Azure Databricks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "DataGuardian Team" }]
keywords = [
    "databricks",
    "delta-lake",
    "data-quality",
    "data-stewardship",
    "azure",
    "pyspark",
    "unity-catalog",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Runtime dependencies — installed in all environments.
# PySpark and delta-spark are provided by the Databricks runtime in production;
# pinned here for local testing only.
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "streamlit>=1.35",
    "openai>=1.35",
    "pyarrow>=15.0",
    "structlog>=24.2",
]

[project.optional-dependencies]
# Development toolchain: testing, linting, type checking
dev = [
    # Testing
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "chispa>=0.9",          # PySpark DataFrame assertion library
    # Linting and formatting
    "ruff>=0.4",
    # Type checking
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    # Security scanning
    "bandit>=1.7",
    # Pre-commit hooks
    "pre-commit>=3.7",
]

# Spark dependencies: used for local integration tests outside Databricks runtime
spark = [
    "pyspark>=3.5",
    "delta-spark>=3.1",
]

[project.urls]
Repository = "https://github.com/rajkumarbandi/dataguardian"
Documentation = "https://github.com/rajkumarbandi/dataguardian/tree/main/docs"
"Bug Tracker" = "https://github.com/rajkumarbandi/dataguardian/issues"
Changelog = "https://github.com/rajkumarbandi/dataguardian/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

# ---------------------------------------------------------------------------
# Ruff — linter and formatter
# https://docs.astral.sh/ruff/
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Rule sets enabled — see https://docs.astral.sh/ruff/rules/
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
]
ignore = [
    "E501",     # line too long — handled by formatter
    "PLR0913",  # too many arguments — acceptable in pipeline constructors
    "PLR2004",  # magic value comparison — acceptable in rule implementations
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # use of assert — expected in tests
    "PLR2004",  # magic value comparison — acceptable in test assertions
]
"scripts/**" = [
    "T201",     # print statements — acceptable in CLI scripts
]

[tool.ruff.lint.isort]
known-first-party = ["dataguardian"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---------------------------------------------------------------------------
# mypy — static type checker
# https://mypy.readthedocs.io/
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "scripts/",
    "databricks/notebooks/",
]

# Per-module overrides for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "pyspark.*",
    "delta.*",
    "chispa.*",
    "streamlit.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest — test runner
# https://docs.pytest.org/
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
    "-v",
    "--tb=short",
]
markers = [
    "unit: fast isolated tests with no external dependencies",
    "integration: tests requiring a Spark session with Delta Lake support",
    "slow: tests with long runtimes, excluded from default CI runs",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src"]
omit = [
    "src/app/*",                # Streamlit UI — tested via browser, not coverage
    "src/**/__init__.py",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# ---------------------------------------------------------------------------
# Bandit — security linter
# https://bandit.readthedocs.io/
# ---------------------------------------------------------------------------

[tool.bandit]
targets = ["src"]
skips = [
    "B101",  # assert — used in internal validation, not security-critical
    "B603",  # subprocess.call — not used; skipped to avoid false positives
]
