# DataGuardian — TEST Environment Configuration
#
# Used exclusively for local development and automated unit/integration tests.
# Points adls_root at the local sample_data/ directory so source YAMLs that use
# the {adls_root} token resolve to real local paths without an ADLS connection.
#
# Example resolution:
#   {adls_root}/raw/erp/customers/  →  sample_data/raw/erp/customers/
#
# Never deploy this environment to a real Databricks workspace.
# Set DATAGUARDIAN_ENV=test when running tests locally.

environment: test

# ---------------------------------------------------------------------------
# Unity Catalog (local Spark uses the default in-memory catalog)
# ---------------------------------------------------------------------------
unity_catalog:
  catalog: dg_test
  schemas:
    bronze: bronze
    silver: silver
    stewardship: stewardship
    gold: gold
    audit: audit

# ---------------------------------------------------------------------------
# Storage — local filesystem (mirrors ADLS path structure under sample_data/)
# ---------------------------------------------------------------------------
storage:
  adls_account: local
  adls_container: sample_data
  adls_root: "sample_data"
  checkpoint_location: "sample_data/_checkpoints"
  raw_zone: "sample_data/raw"
  archive_zone: "sample_data/archive"

# ---------------------------------------------------------------------------
# Ingestion pipeline
# ---------------------------------------------------------------------------
ingestion:
  default_partition_column: _load_date
  batch_size_rows: 10000
  retry_attempts: 1
  retry_delay_seconds: 0
  archive_source_files: false

# ---------------------------------------------------------------------------
# Data Quality
# ---------------------------------------------------------------------------
quality:
  default_dq_threshold: 0.50
  fail_on_threshold_breach: false

# ---------------------------------------------------------------------------
# Stewardship
# ---------------------------------------------------------------------------
stewardship:
  sla_hours: 1
  notifications_enabled: false
  default_approvers: []

# ---------------------------------------------------------------------------
# AI enrichment
# ---------------------------------------------------------------------------
ai:
  enabled: false
  provider: azure_openai

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: DEBUG
  format: json

# ---------------------------------------------------------------------------
# Spark configuration overrides
# ---------------------------------------------------------------------------
spark:
  shuffle_partitions: 2                             # minimal partitions for local tests
  adaptive_query_execution: false                   # disabled for deterministic test results
  broadcast_threshold_mb: 10

# ---------------------------------------------------------------------------
# Pipeline — auditing disabled in test (no Delta catalog available locally)
# ---------------------------------------------------------------------------
pipeline:
  pipeline_name: dataguardian-test
  pipeline_version: "1.0.0"
  audit_enabled: false                              # no Delta writes in unit tests
  retry_policy:
    max_attempts: 1                                 # no retries in tests — fail immediately
    initial_delay_seconds: 0.0
    backoff_multiplier: 1.0
    max_delay_seconds: 0.0

# ---------------------------------------------------------------------------
# Schema Registry — disabled in tests (no Delta writes available locally)
# ---------------------------------------------------------------------------
schema_registry:
  schema_registry_enabled: false                 # no Delta writes — registry is a no-op in tests
  schema_audit_enabled: false                    # no audit.schema_history writes in tests
  default_evolution_mode: STRICT                 # strictest mode to catch regressions early

# ---------------------------------------------------------------------------
# Transformation Engine (Milestone 6)
# ---------------------------------------------------------------------------
transformation:
  audit_enabled: false                           # no Delta writes in unit tests

# ---------------------------------------------------------------------------
# Contract Validation (Milestone 7)
# ---------------------------------------------------------------------------
contract_validation:
  contract_validation_enabled: true
  contract_audit_enabled: false                  # no Delta writes in unit tests
  default_contract_policy: FAIL_PIPELINE         # strictest mode to catch regressions
