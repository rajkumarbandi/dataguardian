resources:
  clusters:
    dataguardian_shared:
      cluster_name: "dataguardian-shared-${bundle.target}"
      spark_version: "${var.spark_version}"
      node_type_id: "${var.node_type_id}"
      autoscale:
        min_workers: 1
        max_workers: 4
      spark_conf:
        spark.databricks.delta.preview.enabled: "true"
        spark.sql.shuffle.partitions: "200"
        spark.databricks.io.cache.enabled: "true"
      data_security_mode: SINGLE_USER
      runtime_engine: PHOTON
      # Runtime dependencies installed on all DataGuardian cluster instances
      library:
        - pypi:
            package: "pydantic>=2.5,<3.0"
        - pypi:
            package: "pyyaml>=6.0"
        - pypi:
            package: "structlog>=24.2"
